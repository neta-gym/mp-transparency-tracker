name: Refresh MPLADS Works

# Keeps the transaction-level MPLADS data fresh by re-pulling work-level
# reports from the official eSAKSHI portal (mplads.mospi.gov.in) and
# committing updated data/. Pushing data/** triggers the Pages deploy.

on:
  schedule:
    - cron: "17 4 * * 1,4" # Mon & Thu 04:17 UTC (~09:47 IST)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-mplads-works
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: pip install aiohttp pydantic pydantic-settings

      - name: Backfill works from eSAKSHI
        run: PYTHONPATH=src python scripts/backfill_works.py --delay 0.3 --force
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(data): MPLADS works refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Open an issue when the refresh fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="MPLADS works refresh failing - eSAKSHI unreachable from Actions runners"
          BODY=$(printf 'The scheduled MPLADS works refresh failed: %s\n\nmplads.mospi.gov.in (eSAKSHI) refuses GitHub Actions runner IPs, so the Mon/Thu refresh cannot complete from Actions. Fund figures stay last-known-good until a refresh runs from a non-Actions network (the backfill script works from other datacenter IPs - verified Sep 11, 2026).' "$RUN_URL")
          if ! gh issue list --state open --search "$TITLE" --json number --jq length | grep -q '^[1-9]'; then
            gh issue create --title "$TITLE" --body "$BODY"
          fi
